<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --bg: #0d0d10;
      --card: #16161a;
      --card-hover: #1e1e24;
      --text: #eaeaea;
      --muted: #7a7a82;
      --on: #22c55e;
      --off: #2a2a30;
      --border: #2a2a30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 280px;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; padding: 0 2px;
    }
    .logo {
      width: 32px; height: 32px; border-radius: 8px;
    }
    .title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
    .subtitle { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .service {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      user-select: none;
    }
    .service:hover { background: var(--card-hover); border-color: #333; }
    .service:active { transform: scale(0.98); }
    .service-left {
      display: flex; align-items: center; gap: 12px;
    }
    .icon {
      width: 20px; height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { display: block; fill: currentColor; }
    .service-name { font-size: 14px; font-weight: 500; }
    .toggle {
      width: 48px; height: 26px; border-radius: 13px;
      background: var(--off); position: relative;
      transition: background 0.25s, box-shadow 0.25s;
      flex-shrink: 0;
    }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.25s;
    }
    .toggle.on::after { transform: translateX(22px); }
    .toggle.on { background: var(--on); }
    .footer {
      margin-top: 14px; text-align: center;
      font-size: 11px; color: var(--muted);
    }
    @media (pointer: coarse) {
      body {
        width: 100vw;
        min-height: 100dvh;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
      }
      body .logo { width: 40px; height: 40px; border-radius: 10px; }
      body .title { font-size: 17px; }
      body .subtitle { font-size: 12px; }
      body #list {
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 8px;
      }
      body #list .service {
        container-type: size;
        flex: 1;
        margin-bottom: 0;
        padding: 12px 18px;
      }
      body #list .service-name { font-size: clamp(15px, 22cqh, 30px); }
      body .icon { width: clamp(20px, 14cqh, 46px); height: clamp(20px, 14cqh, 46px); }
      body .icon svg { width: 100%; height: 100%; }
      body .toggle {
        width: clamp(52px, 34cqh, 116px);
        height: clamp(30px, 22cqh, 64px);
        border-radius: calc(clamp(30px, 22cqh, 64px) / 2);
        transition: none;
      }
      body .toggle::after {
        width: calc(clamp(30px, 22cqh, 64px) - 4px);
        height: calc(clamp(30px, 22cqh, 64px) - 4px);
        top: 2px;
        left: 2px;
        transition: none;
      }
      body .toggle.on::after {
        transform: translateX(calc(clamp(52px, 34cqh, 116px) - clamp(30px, 22cqh, 64px)));
      }
      body .footer { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <img class="logo" src="images/icon32.png" alt="">
    <div>
      <div class="title">Redirector</div>
      <div class="subtitle">Privacy front-ends</div>
    </div>
  </div>
  <div id="list"></div>
  <div class="footer">Click to toggle • Page reloads instantly</div>
